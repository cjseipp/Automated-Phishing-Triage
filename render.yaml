services:
  - type: web
    name: automated-phishing-triage
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run browser/app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --server.enableCORS true --server.enableXsrfProtection true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_ONLY
        value: 'true'
